name: Rebuild 6.32 signing smoke test

on:
  push:
    branches:
      - work/rebuild-632-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Download and verify the exact 6.32 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/braiancorto-alt/mundo-play-updates/releases/download/v6.32-beta/Mundo-Play-6.32-beta.apk" -o "$RUNNER_TEMP/Mundo-Play-6.32-beta.apk"
          echo "db9d37e662042cc722b313c9ef55ad8f74e967802f5d4fe54fdfc9280065e219  $RUNNER_TEMP/Mundo-Play-6.32-beta.apk" | sha256sum --check

      - name: Install Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -o "$RUNNER_TEMP/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool.jar" | sha256sum --check

      - name: Decode, bump test version, and rebuild
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" d -f -s "$RUNNER_TEMP/Mundo-Play-6.32-beta.apk" -o "$RUNNER_TEMP/mundo-play-decoded"
          python3 - "$RUNNER_TEMP/mundo-play-decoded/apktool.yml" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          if not re.search(r"(?m)^  versionCode: 92$", text):
              raise SystemExit("La base 6.32 no tiene el versionCode esperado 92.")
          text = re.sub(r"(?m)^  versionCode: 92$", "  versionCode: 93", text, count=1)
          text = re.sub(r"(?m)^  versionName: .*$", "  versionName: 6.32-beta-smoke", text, count=1)
          path.write_text(text)
          PY
          java -jar "$RUNNER_TEMP/apktool.jar" b "$RUNNER_TEMP/mundo-play-decoded" -o "$RUNNER_TEMP/Mundo-Play-unsigned.apk"

          java -jar "$RUNNER_TEMP/apktool.jar" b "$RUNNER_TEMP/mundo-play-decoded" -o "$RUNNER_TEMP/Mundo-Play-unsigned.apk"

      - name: Sign and verify same package and certificate
        shell: bash
        env:
          MUNDO_PLAY_SIGNING_KEYSTORE_BASE64: ${{ secrets.MUNDO_PLAY_SIGNING_KEYSTORE_BASE64 }}
          MUNDO_PLAY_SIGNING_PASSWORD: ${{ secrets.MUNDO_PLAY_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MUNDO_PLAY_SIGNING_KEYSTORE_BASE64"
          test -n "$MUNDO_PLAY_SIGNING_PASSWORD"
          printf '%s' "$MUNDO_PLAY_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mundo-play.jks"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 "$RUNNER_TEMP/Mundo-Play-unsigned.apk" "$RUNNER_TEMP/Mundo-Play-aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/mundo-play.jks" --ks-key-alias mundoplay --ks-pass env:MUNDO_PLAY_SIGNING_PASSWORD --key-pass env:MUNDO_PLAY_SIGNING_PASSWORD --out "$RUNNER_TEMP/Mundo-Play-6.32-rebuild-smoke.apk" "$RUNNER_TEMP/Mundo-Play-aligned.apk"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/Mundo-Play-6.32-rebuild-smoke.apk"
          "$BT/aapt" dump badging "$RUNNER_TEMP/Mundo-Play-6.32-rebuild-smoke.apk" | grep -F "package: name='com.mundoplay.app' versionCode='93'"
          original_cert=$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/Mundo-Play-6.32-beta.apk" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          rebuilt_cert=$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/Mundo-Play-6.32-rebuild-smoke.apk" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$original_cert"
          test "$original_cert" = "$rebuilt_cert"
          rm -f "$RUNNER_TEMP/mundo-play.jks"

      - name: Package decoded 6.32 base for beta editor work
        shell: bash
        run: zip -qr "$RUNNER_TEMP/mundo-play-6.32-decoded.zip" "$RUNNER_TEMP/mundo-play-decoded"

      - name: Upload decoded 6.32 base
        uses: actions/upload-artifact@v4
        with:
          name: mundo-play-6.32-decoded-base
          path: ${{ runner.temp }}/mundo-play-6.32-decoded.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: mundo-play-6.32-rebuild-smoke
          path: ${{ runner.temp }}/Mundo-Play-6.32-rebuild-smoke.apk
          if-no-files-found: error
          retention-days: 7
