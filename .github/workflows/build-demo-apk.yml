name: Build Mundo Play demo APK
on:
  push:
    branches: [codex/apk-demo]
    paths:
      - 'android-demo/**'
      - '.github/workflows/build-demo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable debug APK
        run: cd android-demo && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mundo-play-demo-apk
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
